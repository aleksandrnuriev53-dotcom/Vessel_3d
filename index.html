<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07121f" />
  <title>3D Атлас: анатомия судна</title>

  <link rel="stylesheet" href="style.css" />

  <!-- SDK Telegram Mini Apps: даёт window.Telegram.WebApp и CSS-переменные безопасных зон -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Three.js подключается как ES-модуль через CDN (версия зафиксирована).
       Для работы без интернета скачайте three@0.160.0 и поправьте пути ниже. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="app">

    <!-- WebGL-холст на весь экран (прозрачный: виден градиент из CSS) -->
    <canvas id="scene" aria-label="Интерактивная 3D-модель грузового судна"></canvas>

    <!-- Экран загрузки -->
    <div id="loader" class="loader">
      <div class="loader-ring"></div>
      <p>Строим судно…</p>
    </div>

    <!-- Слой интерфейса (не перехватывает касания, кроме самих элементов) -->
    <div id="ui" class="ui">

      <!-- Верхняя панель -->
      <header class="topbar glass">
        <div class="topbar-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 15l2 4h14l2-4-9-3-9 3z"/><path d="M12 12V4M12 4l5 3-5 2"/>
          </svg>
        </div>
        <div class="topbar-tx">
          <h1>Атлас анатомии судна</h1>
          <p>Балкер · интерактивная 3D-модель</p>
        </div>
      </header>

      <!-- Быстрая навигация по меткам -->
      <nav id="chips" class="chips" aria-label="Метки модели"></nav>

      <!-- Вертикальная панель кнопок справа -->
      <div class="toolbar">
        <button id="btn-reset" class="fab glass" aria-label="Сбросить вид" title="Сбросить вид">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/>
          </svg>
        </button>
        <button id="btn-rotate" class="fab glass" aria-label="Автовращение" aria-pressed="false" title="Автовращение">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12a9 9 0 0 1 15.5-6.2"/><path d="M18.5 2.5v3.8h-3.8M5.5 21.5v-3.8h3.8"/>
          </svg>
        </button>
      </div>

      <!-- Подсказка (исчезает после первого касания) -->
      <div id="hint" class="hint glass">Вращайте · щипком масштабируйте · нажимайте на светящиеся точки</div>

      <!-- Нижняя «док»-панель с главной кнопкой -->
      <div id="dock" class="dock">
       <div class="dock-row">
        <button id="btn-xray" class="xray-btn" aria-pressed="false">
          <span class="xray-ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
          <span class="xray-tx">
            <b>Разрез / Рентген</b>
            <small id="xray-state">Показать внутренний набор</small>
          </span>
          <span class="switch" aria-hidden="true"><i></i></span>
        </button>

        <!-- Кнопка «Шпаргалки»: открывает стеклянную панель с конспектами -->
        <button id="btn-study" class="study-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="study">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H18v-3"/><path d="M9 8h5M9 11.5h5"/>
          </svg>
          <span>Шпаргалки</span>
        </button>
       </div>
      </div>

      <!-- Карточка-шторка с описанием выбранной метки -->
      <section id="card" class="card glass" role="dialog" aria-labelledby="card-title" aria-hidden="true">
        <div class="card-grab" id="card-grab"><span></span></div>

        <div class="card-head" id="card-head">
          <div class="badge" id="card-badge">1/8</div>
          <div class="titles">
            <h2 id="card-title">Заголовок</h2>
            <p id="card-sub">Subtitle</p>
          </div>
          <button class="icon-btn" id="card-close" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>

        <div class="card-body">
          <div class="diagram" id="card-diagram"></div>
          <div class="desc" id="card-desc"></div>
          <div class="tags" id="card-tags"></div>
        </div>

        <div class="card-foot">
          <button id="card-prev" class="ghost-btn">‹ Назад</button>
          <button id="card-next" class="ghost-btn">Далее ›</button>
        </div>
      </section>

      <!-- ===== Шпаргалки: подложка (3D-фон блюрится через CSS) и стеклянная панель ===== -->
      <div id="study-veil" class="study-veil" aria-hidden="true"></div>

      <section id="study" class="study glass" role="dialog" aria-modal="true" aria-labelledby="study-title" aria-hidden="true">
        <div class="study-grab" id="study-grab"><span></span></div>

        <header class="study-head" id="study-head">
          <div class="study-ic" aria-hidden="true">📝</div>
          <div class="study-titles">
            <h2 id="study-title">Шпаргалки</h2>
            <p id="study-sub"></p>
          </div>
          <button class="icon-btn" id="study-close" aria-label="Закрыть шпаргалки">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </header>

        <!-- Вкладки тем (заполняются из studyData) -->
        <nav class="study-tabs" id="study-tabs" role="tablist" aria-label="Темы шпаргалок"></nav>

        <div class="study-body" id="study-body">
          <div class="study-content" id="study-content" role="tabpanel"></div>
          <p class="study-disc" id="study-disc"></p>
        </div>

        <footer class="study-foot">
          <button id="study-prev" class="ghost-btn" type="button">‹</button>
          <div class="study-dots" id="study-dots" aria-hidden="true"></div>
          <button id="study-next" class="ghost-btn" type="button">›</button>
        </footer>

        <!-- Всплывающая карточка термина («на пальцах») -->
        <div id="term-layer" class="term-layer" aria-hidden="true">
          <div class="term-veil" id="term-veil"></div>
          <article class="term-card" role="dialog" aria-labelledby="term-name">
            <button class="icon-btn term-back" id="term-back" aria-label="Назад к предыдущему термину" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 5l-7 7 7 7"/>
              </svg>
            </button>
            <button class="icon-btn term-x" id="term-close" aria-label="Закрыть термин">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M6 6l12 12M18 6L6 18"/>
              </svg>
            </button>
            <!-- Слоистое содержимое термина рисует study.js -->
            <div id="term-content"></div>

            <div class="term-actions">
              <button type="button" id="term-hard" class="act hard">🤷 Не понял — иначе</button>
              <button type="button" id="term-ok" class="act ok">✅ Понял</button>
            </div>
          </article>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="script.js"></script>
  <button id="toggle-view-btn">🌐 Показать глобус</button>
</body>
</html>
